name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Start Selenoid
      run: |
        docker-compose up -d
        sleep 10  # Даем время Selenoid запуститься
        
    - name: Run tests
      env:
        USE_REMOTE_DRIVER: "true"
        SELENOID_URI: "http://localhost:4444/wd/hub"
      run: |
        pytest --alluredir=allure-results tests/ -v
        
    - name: Install Allure CLI
      if: always()
      run: |
        wget https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.13.9/allure-commandline-2.13.9.zip
        unzip allure-commandline-2.13.9.zip
        sudo mv allure-2.13.9 /opt/allure
        sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure
        
    - name: Generate Allure Report
      if: always()
      run: |
        allure generate allure-results -o allure-report --clean || true
        
    - name: Upload Allure Results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-results
        path: allure-results/
        retention-days: 30
        
    - name: Upload Allure Report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: allure-report
        path: allure-report/
        retention-days: 30
        
    - name: Stop Selenoid
      if: always()
      run: |
        docker-compose down
